{{- if not .Values.registry.existingSecret }}
# Secret para Docker Registry (Private Container Registry)
apiVersion: v1
kind: Secret
metadata:
  name: nexus-registry-secret
  namespace: {{ include "uday-app.namespace" . }}
  labels:
    app: registry
type: kubernetes.io/dockercfg
data:
  .dockercfg: {{ required "Set registry.existingSecret or registry.dockercfg" .Values.registry.dockercfg }}
{{- end }}